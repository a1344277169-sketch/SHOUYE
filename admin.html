<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labagound 编辑器</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<style>
  :root { --side-w: 300px; --field: #ffffff; --field-line: rgba(0,0,0,.14); --ok: #1a7f37; --warn: #b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --field: #1d1d1f; --field-line: rgba(255,255,255,.16); --ok: #4ac26b; --warn: #ff6b60; } }
  :root[data-theme="dark"] { --field: #1d1d1f; --field-line: rgba(255,255,255,.16); --ok: #4ac26b; --warn: #ff6b60; }
  body { background: var(--bg-alt); font-size: 15px; line-height: 1.5; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .bar__in { display: flex; align-items: center; gap: 10px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar h1 { font-size: 17px; font-weight: 600; margin-right: auto; }
  .bar h1 span { color: var(--ink-2); font-weight: 400; }
  .status { font-size: 13px; color: var(--ink-2); }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
  .b { height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--chip); color: var(--ink); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .b:hover { background: var(--line); }
  .b--primary { background: var(--btn); color: #fff; }
  .b--primary:hover { background: var(--btn-hover); }
  .b--danger { color: var(--warn); }
  .b--sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .b:disabled { opacity: .45; cursor: default; }
  .layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - 57px); }
  .side { border-right: 1px solid var(--line); background: var(--bg); padding: 16px 12px 40px; position: sticky; top: 57px; height: calc(100vh - 57px); overflow: auto; }
  .tabs { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 14px; }
  .tabs button { flex: 1; border: 0; background: transparent; height: 30px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; color: var(--ink); }
  .item:hover { background: var(--chip); }
  .item[aria-current="true"] { background: var(--btn); color: #fff; }
  .item[aria-current="true"] small { color: rgba(255,255,255,.8); }
  .item__img { width: 48px; height: 32px; border-radius: 6px; background: var(--chip); flex: none; overflow: hidden; }
  .item__img img { width: 100%; height: 100%; object-fit: cover; }
  .item span { min-width: 0; display: block; }
  .item strong { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { display: block; font-size: 12px; color: var(--ink-2); }
  .group-label { font-size: 12px; color: var(--ink-2); font-weight: 600; margin: 14px 8px 4px; }
  .side .b { width: 100%; justify-content: center; margin-top: 12px; }
  .main { padding: 28px max(16px, env(safe-area-inset-right, 0px)) 120px max(28px, env(safe-area-inset-left, 0px)); max-width: 980px; }
  .main h2 { font-size: 28px; margin-bottom: 4px; }
  .main .sub { color: var(--ink-2); margin-bottom: 24px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .sec { background: var(--surface); border-radius: 18px; padding: 20px 22px; margin-bottom: 16px; }
  .sec > h3 { font-size: 15px; margin-bottom: 14px; }
  .f { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; align-items: start; padding: 10px 0; }
  .f + .f { border-top: 1px solid var(--line); }
  .f > label, .f > .lbl { font-size: 14px; font-weight: 500; padding-top: 7px; }
  .f .hint { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  input[type="text"], input[type="url"], input[type="date"], input[type="email"], select, textarea {
    width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--field); border: 1px solid var(--field-line); border-radius: 9px; padding: 7px 10px; min-width: 0;
  }
  textarea { resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--sel); }
  .i18n { display: flex; flex-direction: column; gap: 6px; }
  .i18n__row { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; }
  .i18n__row b { font-size: 12px; color: var(--ink-2); font-weight: 600; text-align: center; background: var(--chip); border-radius: 6px; height: 24px; line-height: 24px; }
  .i18n__row--top { align-items: start; } .i18n__row--top b { margin-top: 6px; }
  .mdtabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .mdtabs .seg { display: inline-flex; background: var(--chip); padding: 3px; border-radius: 9px; gap: 2px; }
  .mdtabs .seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .mdtabs .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .mdtabs .empty-flag { font-size: 11px; color: var(--warn); margin-left: 2px; }
  .md-preview { border: 1px solid var(--field-line); border-radius: 9px; padding: 20px; background: var(--bg); max-height: 600px; overflow: auto; }
  .md-preview .prose { font-size: 16px; max-width: none; }
  .md-preview .prose > figure, .md-preview .prose > .fig-row { margin-inline: 0; }
  .md-preview .prose > :first-child { margin-top: 0; }
  .imgf { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .imgf__th { width: 120px; aspect-ratio: 16/10; border-radius: 8px; background: var(--chip); overflow: hidden; flex: none; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; }
  .imgf__th img { width: 100%; height: 100%; object-fit: cover; }
  .imgf__ctl { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
  .imgf__btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .gal__it { position: relative; border-radius: 10px; overflow: hidden; background: var(--chip); aspect-ratio: 16/10; }
  .gal__it img { width: 100%; height: 100%; object-fit: cover; }
  .gal__it .ctl { position: absolute; inset: auto 4px 4px; display: flex; gap: 4px; justify-content: flex-end; }
  .gal__it .ctl button { width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
  .gal__add { border: 1.5px dashed var(--field-line); background: transparent; border-radius: 10px; aspect-ratio: 16/10; cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--bg-alt); }
  .row__head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); }
  .banner { margin: 16px max(16px, env(safe-area-inset-left, 0px)) 0; padding: 12px 16px; border-radius: 12px; background: var(--surface); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .banner p { flex: 1; min-width: 200px; }
  .help { font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .help code { background: var(--chip); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #1d1d1f; color: #f5f5f7; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .f { grid-template-columns: 1fr; }
    .f > label, .f > .lbl { padding-top: 0; }
    .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  }
</style>
</head>
<body>
<header class="bar"><div class="bar__in">
  <h1>labagound <span>编辑器</span></h1>
  <span class="status" id="status" role="status"></span>
  <button class="b" id="btnOpen" type="button" title="选择电脑上的网站文件夹（包含 index.html 的那个），之后可以直接保存">打开网站文件夹</button>
  <button class="b" id="btnPreview" type="button">预览</button>
  <button class="b b--primary" id="btnSave" type="button">保存</button>
</div></header>
<div id="banners"></div>
<div class="layout">
  <aside class="side">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="works" aria-selected="true">作品</button>
      <button type="button" role="tab" data-tab="posts" aria-selected="false">树屋</button>
      <button type="button" role="tab" data-tab="site" aria-selected="false">网站</button>
    </div>
    <div id="list"></div>
  </aside>
  <main class="main" id="form"></main>
</div>
<script src="content/content.js"></script>
<script src="assets/site.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
