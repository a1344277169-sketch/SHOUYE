<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日语法 · labagound</title>
<meta name="description" content="JLPT N3・N2 每日语法练习：297 条句型，接续、例句、易混淆辨析与间隔复习；另有 N2 单词 1439 个。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="grammar.css">
<link rel="icon" href="https://labagound.cc/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://labagound.cc/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="https://labagound.cc/apple-touch-icon.png">
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="nav">
  <div class="wrap nav__in">
    <a class="nav__mark" href="https://labagound.cc/" aria-label="labagound 首页"><span class="mark">labagound<i class="dot" aria-hidden="true"></i></span></a>
    <span class="nav__sep" aria-hidden="true"></span>
    <a class="nav__title" href="#/">每日语法</a>
    <nav class="nav__tabs" aria-label="语法">
      <a href="#/" data-tab="today">今日</a>
      <a href="#/list" data-tab="list">语法</a>
      <a href="#/words" data-tab="words">单词</a>
      <a href="#/compare" data-tab="compare">辨析</a>
    </nav>
    <button class="icon-btn" id="openSettings" type="button" aria-label="设置">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16.4 11.8a1.3 1.3 0 0 0 .26 1.43l.05.05a1.58 1.58 0 1 1-2.23 2.23l-.05-.05a1.3 1.3 0 0 0-1.43-.26 1.3 1.3 0 0 0-.79 1.19v.14a1.58 1.58 0 1 1-3.16 0v-.07a1.3 1.3 0 0 0-.85-1.19 1.3 1.3 0 0 0-1.43.26l-.05.05a1.58 1.58 0 1 1-2.23-2.23l.05-.05a1.3 1.3 0 0 0 .26-1.43 1.3 1.3 0 0 0-1.19-.79h-.14a1.58 1.58 0 1 1 0-3.16h.07a1.3 1.3 0 0 0 1.19-.85 1.3 1.3 0 0 0-.26-1.43l-.05-.05A1.58 1.58 0 1 1 6.6 3.36l.05.05a1.3 1.3 0 0 0 1.43.26h.06a1.3 1.3 0 0 0 .79-1.19v-.14a1.58 1.58 0 1 1 3.16 0v.07a1.3 1.3 0 0 0 .79 1.19 1.3 1.3 0 0 0 1.43-.26l.05-.05a1.58 1.58 0 1 1 2.23 2.23l-.05.05a1.3 1.3 0 0 0-.26 1.43v.06a1.3 1.3 0 0 0 1.19.79h.14a1.58 1.58 0 1 1 0 3.16h-.07a1.3 1.3 0 0 0-1.19.79Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot__in">
    <span>JLPT N3・N2 语法 297 条 · N2 单词 1439 个 · 例句为学习用原创例句</span>
    <a href="https://labagound.cc/#tools">返回 labagound</a>
  </div>
</footer>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="sheet__in" id="settingsForm">
    <div class="sheet__head">
      <h2 id="settingsTitle">设置</h2>
      <button class="icon-btn" value="close" aria-label="关闭"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <label class="field"><span>每天新学</span>
      <select name="per"><option value="3">3 条</option><option value="5">5 条</option><option value="8">8 条</option><option value="10">10 条</option><option value="15">15 条</option><option value="20">20 条</option></select>
    </label>
    <label class="field"><span>学习范围</span>
      <select name="scope"><option value="all">N3 → N2（全部）</option><option value="N3">只学 N3</option><option value="N2">只学 N2</option></select>
    </label>
    <label class="field"><span>新语法顺序</span>
      <select name="order"><option value="seq">按编号</option><option value="rand">随机</option></select>
    </label>
    <label class="field"><span>汉字假名</span>
      <select name="furi"><option value="tap">点击汉字时显示</option><option value="always">一直显示</option></select>
    </label>
    <label class="field field--row"><span>例句朗读按钮</span><input type="checkbox" name="tts"></label>
    <p class="sheet__note">修改“每天新学”和范围会从明天的练习开始生效；今天如果还没开始，会立刻生效。</p>
    <div class="sheet__group">
      <h3>学习记录</h3>
      <p class="sheet__note">进度只保存在这台设备的浏览器里。换设备前可以先导出，再在新设备导入。</p>
      <div class="btn-row">
        <button class="btn btn--ghost btn--sm" type="button" id="exportBtn">导出进度</button>
        <label class="btn btn--ghost btn--sm">导入进度<input type="file" accept="application/json,.json" id="importInput" hidden></label>
        <button class="btn btn--danger btn--sm" type="button" id="resetBtn">清空记录</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
